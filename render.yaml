services:
  - type: web
    name: income-tracker-backend
    runtime: python
    runtimeVersion: 3.12
    buildCommand: bash build.sh
    startCommand: bash start.sh
    envVars:
      - key: DEBUG
        value: "False"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: postgres
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://income-tracker-frontend.onrender.com"

  - type: web
    name: income-tracker-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    startCommand: echo "Frontend is static"
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://income-tracker-backend.onrender.com

  - type: pserv
    name: postgres
    plan: free
    ipAllowList: []
