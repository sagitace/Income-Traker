services:
  - type: web
    name: income-tracker-backend
    runtime: python
    runtimeVersion: 3.12
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEBUG
        value: "False"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: postgres
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://income-tracker-frontend.onrender.com"

  - type: web
    name: income-tracker-frontend
    runtime: node
    runtimeVersion: 18
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm run preview -- --host 0.0.0.0 --port $PORT
    envVars:
      - key: VITE_API_URL
        value: https://income-tracker-backend.onrender.com

  - type: pserv
    name: postgres
    plan: free
    ipAllowList: []
