version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: income-tracker-db
    environment:
      POSTGRES_USER: ${DB_USER:-incomeuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeMe123!}
      POSTGRES_DB: ${DB_NAME:-income_tracker}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-incomeuser}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - income-network

  # Backend API
  backend:
    build: ./backend
    container_name: income-tracker-api
    environment:
      DATABASE_URL: postgresql://${DB_USER:-incomeuser}:${DB_PASSWORD:-changeMe123!}@postgres:5432/${DB_NAME:-income_tracker}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-this}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DEBUG: ${DEBUG:-False}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    restart: unless-stopped
    networks:
      - income-network

  # Frontend Web App
  frontend:
    build: ./frontend
    container_name: income-tracker-web
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - income-network

volumes:
  postgres_data:
    driver: local

networks:
  income-network:
    driver: bridge
